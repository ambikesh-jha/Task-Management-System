
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tasks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
            color: #333;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #e9e9e9;
        }
        p {
            text-align: center;
        }
        a {
            text-decoration: none;
            color: red;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>All User Tasks</h1>
 
    <table>
        <tr>
            <th>Username</th>
            <th>Assigned By</th>
            <th>Task</th>
            <th>Status</th>
        </tr>
        {% for task in tasks %}
        <tr>
            <td>{{ task.username }}</td>
            <td>{{ task.assigned_by }}</td>
            <td>{{ task.task }}</td>
            <td>{{ task.task_status }}</td>
        </tr>
        {% endfor %}
    </table>
    
    <p style="margin-top: 20px;">
        <a href="{{ url_for('login_signup_blueprint.logout') }}">Logout</a>
    </p>
</body>
</html>
